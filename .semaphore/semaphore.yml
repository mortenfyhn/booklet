version: v1.0
name: Pipeline
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2204
blocks:
  - name: 'Run checks'
    task:
      jobs:
        - name: 'Run checks'
          commands:
            # Setup
            - checkout
            - sudo apt install -y black qpdf
            # Check Python formatting
            - black --version
            - black --check .
            # Run unit tests
            - python3 -m doctest booklet.py --verbose
            # Make sure it actually runs
            - ./booklet.py blank-a5.pdf output.pdf --padding=end
